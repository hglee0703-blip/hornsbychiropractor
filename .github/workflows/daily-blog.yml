name: Daily blog post

# Runs at 12:30 Sydney time (AEST UTC+10) every day.
on:
  schedule:
    - cron: "30 2 * * *" # UTC 02:30 = Sydney 12:30 AEST
  workflow_dispatch:
    inputs:
      topic:
        description: "Blog topic (leave empty to let AI pick a fresh topic)"
        required: false
        default: ""
      force:
        description: "Force publish even if similar topic exists"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

env:
  # Override these in repo Settings > Variables without changing the workflow.
  OPENAI_MODEL: gpt-5.6
  OPENAI_IMAGE_MODEL: gpt-image-2

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate and publish blog post
        id: gen
        env:
          OPENAI_API_KEY: ${{ secrets.HORNSBYCHIROPRACTORBLOGPOSTANDIMAGE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ github.event.inputs.topic }}
          FORCE: ${{ github.event.inputs.force }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE || '1536x1024' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'medium' }}
        run: python scripts/generate_blog.py

      - name: Commit and push
        env:
          POST_TITLE: ${{ steps.gen.outputs.post_title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit - nothing new was published."
            exit 0
          fi
          TITLE_MSG=$(printf '%s' "$POST_TITLE" | tr -d '"')
          git commit -m "blog: auto-post ${TITLE_MSG:-daily article}"
          RETRIES=0
          until git pull --rebase --autostash origin main && git push origin HEAD; do
            RETRIES=$((RETRIES + 1))
            if [ "$RETRIES" -ge 3 ]; then
              echo "::error::git push failed after 3 attempts"
              exit 1
            fi
            echo "Push conflict, retrying ($RETRIES/3)..."
            sleep 10
          done
