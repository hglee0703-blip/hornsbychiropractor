name: GBP auto-post

# Run only after the blog workflow actually succeeds. This avoids GitHub cron delays
# causing GBP to publish before the day's article exists.
on:
  workflow_run:
    workflows: ["Daily blog post"]
    types: [completed]
  workflow_dispatch:
    inputs:
      post_text:
        description: "Custom summary text for the GBP post (optional; default: generated from latest blog)"
        required: false
        default: ""
      post_url:
        description: "CTA URL for the post (optional; default: latest blog URL or site homepage)"
        required: false
        default: ""
      cta_type:
        description: "Call-to-action type (LEARN_MORE, BOOK, ORDER, SHOP, SIGN_UP, CALL)"
        required: false
        default: "LEARN_MORE"
      media_url:
        description: "Optional image sourceUrl (jpg/png, <=5MB, >=400x300)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: gbp-post
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Create GBP local post
        id: gbp
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_POST_TEXT: ${{ github.event.inputs.post_text }}
          GBP_POST_URL: ${{ github.event.inputs.post_url }}
          GBP_CTA_TYPE: ${{ github.event.inputs.cta_type }}
          GBP_MEDIA_URL: ${{ github.event.inputs.media_url }}
          GBP_LANGUAGE_CODE: en-AU
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/generate_gbp_post.py --out gbp-result.json

      - name: Read result
        id: result
        if: always()
        run: |
          if [ ! -f gbp-result.json ]; then
            echo '{"success":false,"error":"MissingResult","message":"gbp-result.json was not created"}' > gbp-result.json
          fi
          cat gbp-result.json
          echo "result<<EOF" >> $GITHUB_OUTPUT
          cat gbp-result.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Append to gbp-posts.json log
        if: always()
        run: |
          LOG_FILE="gbp-posts.json"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RESULT_JSON=$(cat gbp-result.json)

          if [ -f "$LOG_FILE" ]; then
            # Append to existing array
            tmp=$(mktemp)
            jq --argjson entry "$RESULT_JSON" '. += [$entry]' "$LOG_FILE" > "$tmp"
            mv "$tmp" "$LOG_FILE"
          else
            # Create new array with first entry
            echo "[$RESULT_JSON]" > "$LOG_FILE"
          fi

      - name: Commit and push log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gbp-posts.json
          if git diff --cached --quiet; then
            echo "No log changes to commit"
          else
            STATUS=$(echo "${{ steps.result.outputs.result }}" | jq -r '.success // false')
            MSG="gbp: log post $(if [ "$STATUS" = "true" ]; then echo "ok"; else echo "failed"; fi) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git commit -m "$MSG"
            RETRIES=0
            until git pull --rebase --autostash origin main && git push origin HEAD; do
              RETRIES=$((RETRIES + 1))
              if [ "$RETRIES" -ge 3 ]; then
                echo "::error::git push failed after 3 attempts"
                exit 1
              fi
              echo "Push conflict, retrying ($RETRIES/3)..."
              sleep 10
            done
          fi

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESULT_JSON=$(cat gbp-result.json)
          ERROR_MSG=$(echo "$RESULT_JSON" | jq -r '.error // "Unknown error"')
          MESSAGE=$(echo "$RESULT_JSON" | jq -r '.message // "GBP post failed"')
          TEXT="❌ <b>GBP Auto-post Failed</b>
          Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Error: $ERROR_MSG
          Detail: $MESSAGE
          Repo: hornsbychiropractor
          Workflow: GBP auto-post
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="$TEXT"
